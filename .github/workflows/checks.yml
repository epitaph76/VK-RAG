name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi==0.162.0 pydantic==2.14.2 requests==2.34.2 beautifulsoup4==4.14.3 feedparser==6.0.14 trafilatura==2.3.1 python-multipart==0.0.32 itsdangerous==2.2.0 numpy==2.5.4 bm25s==0.3.16 filelock==4.2.4 pytest httpx
      - run: pip install --no-deps -e .
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
